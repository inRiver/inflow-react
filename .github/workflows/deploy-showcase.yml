name: Deploy Showcase to GitHub Pages

on:
  push:
    tags:
      - 'theme/*/v*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v6
        with:
          # Checkout the exact tag that triggered the workflow so the
          # showcase always reflects the released version, not the current
          # state of the default branch.
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - run: npm run lint

      - run: npm run test:run

      # Build only the showcase app; the library build is not part of the
      # deployed site. The base path matches the repository name because
      # GitHub Pages serves the site under /inflow-react/.
      - run: npx vite build --base /inflow-react/
        env:
          VITE_BASE_URL: /inflow-react/

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
